; Podcast Jukebox firmware
; Board: Sunton ESP32-3248S035R (ESP32-WROOM-32, 4 MB flash, no PSRAM)
; Platform: pioarduino fork so we get arduino-esp32 3.x (same core family as AnandRadio)

[platformio]
default_envs = sunton35

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DFW_VERSION=\"${sysenv.FW_VERSION}\"
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.1
    tzapu/WiFiManager @ ^2.0.17

[env:sunton35]
board = esp32dev
board_build.partitions = min_spiffs.csv   ; two 1.9 MB OTA slots on 4 MB flash
board_build.f_cpu = 240000000L
upload_speed = 921600
