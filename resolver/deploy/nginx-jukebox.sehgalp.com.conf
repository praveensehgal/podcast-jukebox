# Podcast Jukebox resolver (repo praveensehgal/podcast-jukebox, /srv/jukebox).
# Port 80 must stay plain HTTP with NO redirect: the device (ESP32, no PSRAM) cannot hold a
# TLS session while it decodes audio (decision 005). Every endpoint but /health needs the
# X-Jukebox-Token header; the container enforces it. 443 is for people and tests.
limit_req_zone $binary_remote_addr zone=jukebox_api:10m rate=60r/m;

server {
    listen 80;
    server_name jukebox.sehgalp.com;
    client_max_body_size 16k;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Audio relay: runs at listening speed for up to hours, so no buffering, long timeouts.
    location /stream {
        limit_req zone=jukebox_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 6h;
        proxy_send_timeout 6h;
    }

    location / {
        limit_req zone=jukebox_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    server_name jukebox.sehgalp.com;
    client_max_body_size 16k;
    ssl_certificate /etc/letsencrypt/live/jukebox.sehgalp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jukebox.sehgalp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /stream {
        limit_req zone=jukebox_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 6h;
        proxy_send_timeout 6h;
    }

    location / {
        limit_req zone=jukebox_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
